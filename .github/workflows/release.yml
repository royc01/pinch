name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example v2.5.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A manually dispatched run starts from the default branch, so explicitly
          # check out the selected tag in that case.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "const fs=require('fs'); const expected=process.env.RELEASE_TAG.replace(/^v/,''); const pkg=JSON.parse(fs.readFileSync('package.json')); const plugin=JSON.parse(fs.readFileSync('plugin.json')); if (![pkg.version, plugin.version].every(v=>v===expected)) { console.error('Release tag and manifest versions must match:', {expected, package: pkg.version, plugin: plugin.version}); process.exit(1); }"

      - name: Type check production sources
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build for production
        run: npm run build

      - name: Verify package.zip exists
        run: |
          if [ ! -f "package.zip" ]; then
            echo "Error: package.zip was not created!"
            exit 1
          fi
          ls -la package.zip
          echo "Package size: $(du -h package.zip)"

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.release_tag || github.ref_name }}
          prerelease: false
